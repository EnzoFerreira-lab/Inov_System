{#
  Biblioteca de ícones em SVG, traçado de 24x24 herdando a cor do texto.
  Substitui os emojis do menu — mesmo peso visual em qualquer sistema.
  Uso:  {% from '_icons.html' import icon %}  ...  {{ icon('obras') }}
#}

{% macro icon(nome) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nome == 'dashboard' -%}
    <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/>
    <rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
{%- elif nome == 'obras' -%}

    <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>

{%- elif nome == 'totais' -%}

{%- elif nome == 'lancamentos' -%}

    <path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>
{%- elif nome == 'categorias' -%}
    <path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/>
    <path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>
{%- elif nome == 'taxas' -%}

    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
{%- elif nome == 'sucesso' -%}
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
{%- elif nome == 'erro' -%}
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
{%- elif nome == 'info' -%}

{%- elif nome == 'editar' -%}
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>
{%- elif nome == 'calendario' -%}
    <rect width="18" height="18" x="3" y="4" rx="2"/>
    <path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/>
{%- elif nome == 'cima' -%}
    <path d="m18 15-6-6-6 6"/>
{%- elif nome == 'baixo' -%}
    <path d="m6 9 6 6 6-6"/>
{%- elif nome == 'usuarios' -%}

    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
{%- elif nome == 'backup' -%}

    <path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>
{%- elif nome == 'cadeado' -%}
    <rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
{%- elif nome == 'alerta' -%}
    <path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/>

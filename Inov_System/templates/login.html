<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · INOV</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

    <div class="login-container">
        <div class="login-brand">
            <div class="logo">I</div>
            <h1>INOV</h1>
            <p>Sistema contábil por centro de custo</p>
        </div>

        {% include '_flash.html' %}

        <form method="POST">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input class="input" type="email" name="email" id="email"
                       placeholder="voce@empresa.com.br" autocomplete="username" autofocus required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input class="input" type="password" name="senha" id="senha"
                       placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary btn-block mt-2" type="submit">Entrar</button>
        </form>

        <div class="login-foot">Acesso restrito aos usuários da contabilidade</div>
    </div>

</body>
</html>
